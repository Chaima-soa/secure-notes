<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ note.title }} - Secure Notes</title>
</head>

<body>

    <h1>🔐 Secure Notes</h1>

    <hr>

    <p>
        Logged in as:
        <strong>{{ session["username"] }}</strong>
    </p>

    <p>
        <a href="{{ url_for('auth.profile') }}">
            <button>🏠 Dashboard</button>
        </a>

        <a href="{{ url_for('notes.index') }}">
            <button>📝 My Notes</button>
        </a>

        <a href="{{ url_for('notes.create') }}">
            <button>➕ Create Note</button>
        </a>

        <a href="{{ url_for('auth.logout') }}">
            <button>🚪 Logout</button>
        </a>
    </p>

    <hr>

    <h2>📝 {{ note.title }}</h2>

    <p>
        {{ note.content }}
    </p>

    <hr>

    <p>
        <strong>Created:</strong>
        {{ note.created_at }}
    </p>

    <p>
        <strong>Updated:</strong>
        {{ note.updated_at }}
    </p>

    <p>
        <a href="{{ url_for('notes.index') }}">
            ← Back to My Notes
        </a>
    </p>

</body>
</html>
