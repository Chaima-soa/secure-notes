<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Note - Secure Notes</title>
</head>

<body>

    <h1>🔐 Secure Notes</h1>

    <hr>

    <p>
        Logged in as:
        <strong>{{ session["username"] }}</strong>
    </p>

    <p>
        <a href="{{ url_for('auth.profile') }}">
            <button>🏠 Dashboard</button>
        </a>

        <a href="{{ url_for('notes.index') }}">
            <button>📝 My Notes</button>
        </a>

        <a href="{{ url_for('notes.create') }}">
            <button>➕ Create Note</button>
        </a>

        <a href="{{ url_for('auth.logout') }}">
            <button>🚪 Logout</button>
        </a>
    </p>

    <hr>

    <h2>➕ Create a New Note</h2>

    <form method="POST" action="{{ url_for('notes.create') }}">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div>
            <label for="title">
                <strong>Title</strong>
            </label>

            <br>

            <input
                type="text"
                id="title"
                name="title"
                required
                maxlength="100"
            >
        </div>

        <br>

        <div>
            <label for="content">
                <strong>Content</strong>
            </label>

            <br>

            <textarea
                id="content"
                name="content"
                rows="10"
                cols="60"
                required
                maxlength="10000"
            ></textarea>
        </div>

        <br>

        <button type="submit">
            🔒 Save Secure Note
        </button>

    </form>

    <p>
        <a href="{{ url_for('notes.index') }}">
            ← Back to My Notes
        </a>
    </p>

</body>
</html>
